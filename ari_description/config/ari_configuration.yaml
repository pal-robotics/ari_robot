robot_model:
  description: 'Robot model'
  choices: ['v1', 'v2']
  default_value: 'v2'
laser_model:
  description: 'Laser model'
  choices: ['no-laser', 'sick-571', 'ydlidar-tg15', 'ydlidar-tg30']
  default_value: 'sick-571'
end_effector:
  description: 'End effector model'
  choices: ['no-end-effector', 'ari-hand']
  default_value: 'ari-hand'
camera_model_head:
  description: 'Head camera model'
  choices: ['raspi', 'realsense-d435i', 'realsense-d435']
  default_value: 'raspi'
camera_model_front:
  description: 'Front camera model'
  choices: ['no-camera', 'realsense-d435i', 'realsense-d435']
  default_value: 'realsense-d435'
camera_model_back:
  description: 'Back camera model'
  choices: ['no-camera', 'realsense-t265']
  default_value: 'realsense-t265'